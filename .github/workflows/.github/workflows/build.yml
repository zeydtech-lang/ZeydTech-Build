name: ZeydTech APK Builder
on:
  push:
  workflow_dispatch:
    paths:
      - 'latest_app.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Buildozer
        run: |
          pip install --user --upgrade buildozer cython
          sudo apt-get install -y python3-dev build-essential libssl-dev libffi-dev libxml2-dev libxslt1-dev zlib1g-dev ncurses-dev

      - name: Create Buildozer Spec
        run: |
          # سنقوم بإنشاء إعدادات بسيطة تحول الـ HTML إلى WebView
          buildozer init
          sed -i 's/package.name = myapp/package.name = zeydtech/g' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = html,css,js,png,jpg/g' buildozer.spec

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: ZeydTech-Package
          path: bin/*.apk
